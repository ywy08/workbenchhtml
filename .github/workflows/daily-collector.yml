name: Daily Workbench Data Collector

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios @octokit/rest

      - name: Collect data and update daily-data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          node scripts/collect.js

      - name: Verify update
        run: |
          echo "Data collection completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Data URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/daily-data.json"